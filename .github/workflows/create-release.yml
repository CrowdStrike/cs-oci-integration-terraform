name: Create Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Extract version from outputs.tf
        id: version
        run: |
          VERSION=$(grep -A2 'output "template_version"' templates/Resource_Manager_Template/outputs.tf | grep 'value' | sed -E 's/.*"(v[0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Error: template_version not found in outputs.tf" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check whether release already exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Release $VERSION already exists; skipping release. Bump template_version in outputs.tf to publish a new release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Resource Manager Template package
        if: steps.check.outputs.exists == 'false'
        run: |
          cd templates/Resource_Manager_Template
          zip -r ../../Resource_Manager_Template-${{ steps.version.outputs.VERSION }}.zip . \
            -x '.terraform/*' -x '.terraform.lock.hcl'
          cd ../..
          cp Resource_Manager_Template-${{ steps.version.outputs.VERSION }}.zip Resource_Manager_Template-latest.zip

      - name: Delete previous static asset from older releases
        if: steps.check.outputs.exists == 'false'
        continue-on-error: true
        run: |
          RELEASES=$(gh api repos/${{ github.repository }}/releases?per_page=100 --jq '.[] | select(.assets != null) | .assets[] | select(.name=="Resource_Manager_Template-latest.zip") | .id')
          for asset_id in $RELEASES; do
            echo "Deleting asset ID: $asset_id"
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$asset_id
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --title "Release ${{ steps.version.outputs.VERSION }}" \
            --generate-notes \
            "Resource_Manager_Template-${{ steps.version.outputs.VERSION }}.zip" \
            "Resource_Manager_Template-latest.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
