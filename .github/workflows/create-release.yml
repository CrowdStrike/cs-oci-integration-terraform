name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Create Resource Manager Template package
        run: |
          cd templates/Resource_Manager_Template
          zip -r ../../Resource_Manager_Template-${{ steps.version.outputs.VERSION }}.zip . \
            -x '.terraform/*' -x '.terraform.lock.hcl'
          cd ../..
          cp Resource_Manager_Template-${{ steps.version.outputs.VERSION }}.zip Resource_Manager_Template-latest.zip

      - name: Delete previous static asset from older releases
        continue-on-error: true
        run: |
          RELEASES=$(gh api repos/${{ github.repository }}/releases?per_page=100 --jq '.[] | select(.assets != null) | .assets[] | select(.name=="Resource_Manager_Template-latest.zip") | .id')
          for asset_id in $RELEASES; do
            echo "Deleting asset ID: $asset_id"
            gh api -X DELETE repos/${{ github.repository }}/releases/assets/$asset_id
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "${{ steps.version.outputs.VERSION }}" \
            --title "Release ${{ steps.version.outputs.VERSION }}" \
            --generate-notes \
            "Resource_Manager_Template-${{ steps.version.outputs.VERSION }}.zip" \
            "Resource_Manager_Template-latest.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
